function startRound(v){clearWaitTimer();dropLobby();PV.round=v.round;PV.playing=true;PV.seen=0;PV.resyncedTo=0;PV.pend=Promise.resolve();PV.sendQ=Promise.resolve();PV.oppLeft=false;PV.startingFree=false;
 if(PV.od){const od=PV.od;PV.od=null;try{od.cancel().catch(()=>{})}catch(e){}}

 PV.freeMode=!!v.free;
 if(PV.freeMode){

   const arr=[];for(let k=0;k<len;k++){const val=sh[k];arr.push(val==null||val<0?null:val)}hand=arr}

 if(!iFirst)render();
 syncHand();names();

 toast(mapMsg+(iFirst?'내가 먼저 시작해요':(PV.oppName||'상대')+'님이 먼저 시작해요'),2200)}
function pump(mv){if(!mv)return;
 while(mv[PV.seen]){const idx=PV.seen++,m=mv[idx];if(m.by===PV.uid)continue;
  PV.pend=PV.pend.catch(()=>{}).then(()=>applyRemote(m,idx)).catch(err=>{console.error('[친선전]',err);if(PV.playing){resyncRoomState();toast('보드 상태를 다시 동기화했어요',2000)}})}}
async function applyRemote(m,idx){if(!PV.playing||(idx!=null&&idx<PV.resyncedTo))return;
 const opp=PV.oppName||'상대';
 if(m.t=='wc'){
  const wn=(WC_BY_ID[m.id]||{}).n||m.id;
  if(m.id=='pis'){wu().ai.pis=true;toast(opp+'님이 '+wn+'을(를) 사용했어요',1800);await pisces('ai');return}
  if(m.id=='met'){wu().ai.met=true;toast(opp+'님이 사자자리 유성우를 사용했어요',1800);await meteor('ai',m.pk||[]);return}
  if(m.id=='light'){wu().ai.light=true;lfx.ai=true;bell(1245,.08,.8);toast(opp+'님이 화성의 빛을 사용했어요',1800);render();return}
  if(m.id=='aqua'){wu().ai.aqua=true;aqf.ai=true;bell(1245,.08,.8);toast(opp+'님이 물병자리를 사용했어요',1800);render();return}
  if(m.id=='eq'){toast(opp+'님이 이쿼녹스를 사용했어요',1800);await equinox('ai');render();return}
  if(m.id=='alb'){toast(opp+'님이 알베도를 사용했어요',1800);await albedo('ai');return}
  if(m.id=='solar'){toast(opp+'님이 솔라파워를 사용했어요',1800);await solarPower('ai');return}
  if(m.id=='apo'){toast(opp+'님이 원지점을 사용했어요',1800);await _apogee(m.i,'ai');return}
  if(m.id=='plasma'){toast(opp+'님이 플라스마 방출을 사용했어요',1800);await _plasmaBurst(m.i,'ai');return}
  if(m.id=='iso'){wu().ai.iso=true;lock={i:m.i,by:'ai'};bell(1245,.08,.8);toast(opp+'님이 월면고립을 사용했어요',1800);render();return}
  if(m.id=='tau'){await tauAi(m.k,m.np);return}
  if(m.id=='proph'){wu().ai.proph=true;prophecy={by:'ai',cell:m.c,phase:m.p};bell(1245,.08,.8);toast(opp+'님이 일식예언을 발동했어요! 다음 수를 지켜봅니다',2200);render();return}
  if(m.id=='redpx'){await redPixel('ai',{me:m.hAi,ai:m.hMe});syncHand();return}
  return}
 const fx=m.fx||[],isCap=fx.includes('cap');
 if((isCap?!B[m.i]:!!B[m.i])||m.p==null){if(resyncRoomState()){toast('보드 상태를 다시 동기화했어요',2000);return}turn='me';busy=false;render();toast('동기화 오류가 발생했어요',2200);return}
 if(m.joker){wu().ai.joker=true;toast(opp+'님이 조커를 사용했어요!',1600);bell(1661,.08,.8)}
 else{const hk=aiH.findIndex(x=>x!=null);if(hk>=0)aiH[hk]=null}
 await _place(m.i,null,'ai',fx,m.p)}

/* ---------- 게임 함수 후킹 ---------- */
window._pvSyncHand=syncHand;
window._pvOppHand=()=>PV.playing&&PV.oppRealHand?PV.oppRealHand:null;
window._pvOnMeteor=pk=>{if(PV.playing)sendWC({id:'met',pk})};
window._pvWL=who=>(PV.active&&PV.freeMode)?((who==='ai'?PV.oppWC:PV.myWC).map(id=>WC_BY_ID[id]).filter(Boolean)):null;
const _place=place;
place=function(i,idx,who,fx,jc){
 if(PV.playing&&who=='me'){
  fx=fx||[];
  const card=jc!=null?jc:hand[idx],isCap=fx.includes('cap');
  if(card==null||(isCap?!B[i]:!!B[i])){busy=false;render();return}
  const n=PV.seen++,msg={by:PV.uid,t:'place',i:i,p:card};
  if(fx.length)msg.fx=fx;
  if(jc!=null)msg.joker=true;
  sendMove(n,msg).catch(()=>{});
  const r=_place(i,idx,'me',fx,jc);
  syncHand();
  PV.pend=PV.pend.catch(()=>{}).then(()=>r).catch(()=>{});return r}
 return _place.apply(this,arguments)};
const _useWC=useWC;
useWC=async function(k){
 if(!PV.playing)return _useWC.apply(this,arguments);
 const wl=(window._pvWL&&window._pvWL('me'))||WC[WD]||[],w=wl&&wl[k];
 if(!w||busy||turn!='me'||used('me',w.id))return _useWC.apply(this,arguments);
 if(w.id=='pis'){sendWC({id:'pis'});const r=await _useWC.apply(this,arguments);syncHand();return r}
 if(w.id=='redpx'){if(!oppLastSnap.me)return;closeWI();const hMe=[ph(),ph(),ph()],hAi=[ph(),ph(),ph()];sendWC({id:'redpx',hMe,hAi});busy=true;try{render();await redPixel('me',{me:hMe,ai:hAi})}finally{busy=false;render()}return}
 if(w.id=='eq'){if(B.filter(c=>!c).length<3&&!prevOppWc.has('eq'))return;sendWC({id:'eq'});return _useWC.apply(this,arguments)}
 if(w.id=='alb'){if((B.filter(c=>!c).length<3&&!prevOppWc.has('alb'))||!B.some(c=>c&&(c.o=='me'||c.o=='ai')))return;sendWC({id:'alb'});return _useWC.apply(this,arguments)}
 if(w.id=='solar'){if(!B.some(c=>c&&c.o=='me'))return;sendWC({id:'solar'});return _useWC.apply(this,arguments)}
 if(w.id=='aqua'||w.id=='light'){sendWC({id:w.id});return _useWC.apply(this,arguments)}
 return _useWC.apply(this,arguments)};

const _apogee=apogee;

async function leave(msg){if(PV.leaving)return;PV.leaving=true;const D=PV.D;clearWaitTimer();clearSess();

  await dropLobbyAsync();
  if(PV.roomRef){if(PV.role=='host')await D.remove(PV.roomRef);else if(PV.room)await D.update(PV.roomRef,{['left/'+PV.role]:true,['pres/'+PV.role]:null})}

async function restoreSession(){
 let sess=null;try{sess=JSON.parse(readTab('pv_sess')||'null')}catch(e){sess=null}
 if(!sess||!sess.code||!sess.role||!sess.uid||Date.now()-(sess.t||0)>72e5||!cfg()){clearSess();return}
 PV.uid=sess.uid;writeTab('pv_uid',PV.uid);
 if(sess.name)PV.name=sess.name;PV.mode=sess.mode==3?3:1;
 if(sess.world!=null)PV.world=sess.world;if(sess.stage!=null)PV.stage=sess.stage;PV.pub=sess.pub!==false;
 PV.scr='joining';show('<div class="pvs2">이전 친선전에 다시 연결 중…</div>');
 try{const db=await fb();netOn(db);const D=PV.D,r=D.ref(db,'fm/rooms/'+sess.code),s=await D.get(r);
  if(!s.exists()){clearSess();netOff();hide();toast('이전 방이 종료됐어요',1800);return}
  const v=s.val();
  if((v.left&&v.left[sess.role])||!v[sess.role]||v[sess.role].id!==sess.uid){clearSess();netOff();hide();return}
  PV.mode=v.mode==3?3:1;
  await D.update(r,{['pres/'+sess.role]:true});
  await enter(sess.code,sess.role,!!v.quick,v.status!=='wait',!!v.free);
 }catch(err){if(!PV.active){netOff();hide()}}}

  if(PV.active&&!PV.leaving&&PV.db){netOn(PV.db)}

});
